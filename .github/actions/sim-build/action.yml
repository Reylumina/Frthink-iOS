name: Simulator Setup & Build
description: Configure Xcode, boot an available iPhone simulator, and build Frthink for iOS Simulator.

inputs:
  extra-build-args:
    description: Extra arguments appended to xcodebuild
    required: false
    default: ""
  show-devices:
    description: Print available simulator devices
    required: false
    default: "false"

outputs:
  device:
    description: Booted simulator UDID
    value: ${{ steps.boot.outputs.device }}
  app-path:
    description: Built Frthink.app path
    value: ${{ steps.build.outputs.app-path }}

runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show toolchain
      shell: bash
      run: |
        xcodebuild -version
        if [ "${{ inputs.show-devices }}" = "true" ]; then
          xcrun simctl list devices available | head -30
        fi

    - name: Boot simulator
      id: boot
      shell: bash
      run: |
        set -euo pipefail
        DEVICE="$(xcrun simctl list devices available -j \
          | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print([x["udid"] for xs in d.values() for x in xs if "iPhone" in x["name"]][0])')"
        echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
        echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
        xcrun simctl boot "$DEVICE" || true
        xcrun simctl bootstatus "$DEVICE" -b

    - name: Build for simulator
      id: build
      shell: bash
      run: |
        set -o pipefail
        # 模拟器构建需保留 ad-hoc 签名以提供 application-identifier，否则 Keychain 返回 -34018。
        xcodebuild \
          -project ios/Frthink.xcodeproj \
          -scheme Frthink \
          -configuration Debug \
          -destination "id=$DEVICE" \
          -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          ${{ inputs.extra-build-args }} \
          build
        APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name "Frthink.app")"
        echo "app-path=$APP" >> "$GITHUB_OUTPUT"
