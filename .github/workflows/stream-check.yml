name: Stream Check

# 以 DEBUG 本地 mock SSE 驱动真实 OpenAICompatibleClient 与 WriterController，
# 连续运行三次并校验完成标记与截图，覆盖流式解析、增量排版与结束态。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-stream:
    name: Mock SSE stream x3
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Boot simulator and build
        id: sim
        uses: ./.github/actions/sim-build

      - name: Install
        run: xcrun simctl install "$DEVICE" "${{ steps.sim.outputs.app-path }}"

      - name: Install image checker
        run: python3 -m pip install --quiet --break-system-packages pillow

      - name: Run mock stream three times
        run: |
          set -euo pipefail
          mkdir -p screenshots logs
          python3 .github/scripts/mock_sse_server.py > logs/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/health >/dev/null

          for i in 1 2 3; do
            xcrun simctl terminate "$DEVICE" com.frthink.app || true
            xcrun simctl launch --console-pty "$DEVICE" com.frthink.app \
              -seedDemo -initialTab 创作 -mockStream -mockAutoSend \
              > "logs/stream-$i.log" 2>&1 &
            LAUNCH_PID=$!
            # 最多等待 30 秒，收到完成标记后再截图。
            for _ in $(seq 1 30); do
              if grep -q "MOCK STREAM DONE" "logs/stream-$i.log"; then break; fi
              sleep 1
            done
            xcrun simctl io "$DEVICE" screenshot "screenshots/stream-$i.png"
            xcrun simctl terminate "$DEVICE" com.frthink.app || true
            wait "$LAUNCH_PID" || true
            echo "--- run $i ---"
            grep -q "MOCK STREAM DONE" "logs/stream-$i.log"
            python3 .github/scripts/check_stream_shot.py "screenshots/stream-$i.png"
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-stream-evidence
          path: |
            screenshots
            logs
          if-no-files-found: ignore
          retention-days: 14
