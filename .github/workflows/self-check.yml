name: Self Check
run-name: "Self Check #${{ github.run_number }}"

# 仅编译、安装并执行 -runSelfCheck，不截图；适用于逻辑、存档、加密与协议改动验证。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint DESIGN.md rules
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --reporter github-actions-logging

  self-check:
    name: Run self check on simulator
    needs: lint
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Boot simulator and build
        id: sim
        uses: ./.github/actions/sim-build
        with:
          show-devices: "true"

      - name: Install
        run: xcrun simctl install "$DEVICE" "${{ steps.sim.outputs.app-path }}"

      - name: Run self check
        run: |
          set -o pipefail
          xcrun simctl terminate "$DEVICE" com.frthink.app || true
          xcrun simctl launch --console-pty "$DEVICE" com.frthink.app -runSelfCheck \
            | tee selfcheck.log
          grep -q "ALL PASS" selfcheck.log

      - name: Upload self check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfcheck-log
          path: selfcheck.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfcheck-build-log
          path: ${{ runner.temp }}/DerivedData/Logs/Build
          if-no-files-found: ignore
          retention-days: 7
