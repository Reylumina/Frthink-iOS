name: Real Archive Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Boot simulator
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print([x["udid"] for xs in d.values() for x in xs if "iPhone" in x["name"]][0])')"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Frthink.xcodeproj \
            -scheme Frthink \
            -configuration Debug \
            -destination "id=$DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Attach real backup fixture
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name Frthink.app)"
          cp .github/fixtures/fixture-backup.frthink "$APP/fixture-backup.frthink"
          xcrun simctl install "$DEVICE" "$APP"

      - name: Run self check
        run: |
          set -o pipefail
          xcrun simctl terminate "$DEVICE" com.frthink.app || true
          xcrun simctl launch --console-pty "$DEVICE" com.frthink.app -runSelfCheck \
            | tee "$RUNNER_TEMP/selfcheck.log"
          grep -q "ALL PASS" "$RUNNER_TEMP/selfcheck.log"
          grep -q "archive.realBackup" "$RUNNER_TEMP/selfcheck.log"
          grep -q "real backup import/export/restore PASS" "$RUNNER_TEMP/selfcheck.log"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-archive-log
          path: ${{ runner.temp }}/selfcheck.log
          if-no-files-found: ignore
          retention-days: 14
