name: Real Archive Verify

# 将仓库内真实备份夹具打入模拟器包并执行 -runSelfCheck，验证导入、导出与回写。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Boot simulator and build
        id: sim
        uses: ./.github/actions/sim-build
        with:
          extra-build-args: CODE_SIGNING_ALLOWED=NO

      - name: Attach real backup fixture
        run: |
          set -euo pipefail
          APP="${{ steps.sim.outputs.app-path }}"
          cp .github/fixtures/fixture-backup.frthink "$APP/fixture-backup.frthink"
          xcrun simctl install "$DEVICE" "$APP"

      - name: Run self check
        run: |
          set -o pipefail
          xcrun simctl terminate "$DEVICE" com.frthink.app || true
          xcrun simctl launch --console-pty "$DEVICE" com.frthink.app -runSelfCheck \
            | tee "$RUNNER_TEMP/selfcheck.log"
          grep -q "ALL PASS" "$RUNNER_TEMP/selfcheck.log"
          grep -q "archive.realBackup" "$RUNNER_TEMP/selfcheck.log"
          grep -q "real backup import/export/restore PASS" "$RUNNER_TEMP/selfcheck.log"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-archive-log
          path: ${{ runner.temp }}/selfcheck.log
          if-no-files-found: ignore
          retention-days: 14
