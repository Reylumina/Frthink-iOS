# XcodeGen 兜底方案。
#
# 主工程是手写的 `Frthink.xcodeproj/project.pbxproj`（文件夹同步分组，Xcode 16+）。
# 万一那份 pbxproj 在某个 Xcode 版本上打不开，用这个文件重新生成：
#
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# 生成结果与手写工程等价。

name: Frthink
options:
  bundleIdPrefix: com.frthink
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Frthink:
    type: application
    platform: iOS
    sources:
      - path: Frthink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frthink.app
        PRODUCT_NAME: Frthink
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Frthink
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
