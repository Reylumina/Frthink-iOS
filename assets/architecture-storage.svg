<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 316" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .panel { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; rx: 12; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 600; fill: #0F172A; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #64748B; }
      .card-emerald { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 1.2; rx: 8; }
      .card-blue { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1.2; rx: 8; }
      .card-indigo { fill: #EEF2FF; stroke: #C7D2FE; stroke-width: 1.2; rx: 8; }
      .card-slate { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1.2; rx: 8; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13.5px; font-weight: 600; fill: #1E293B; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect width="1120" height="316" rx="16" class="bg"/>

  <rect x="20" y="18" width="1080" height="280" class="panel"/>
  <text x="38" y="45" class="header">世界工作台与分文件加密存储</text>
  <text x="246" y="45" class="sub">全书共享设定档案与全局规则；平行试写通过书库「项目级分支」独立隔离正文与对话</text>

  <!-- Card 1 -->
  <rect x="38" y="60" width="506" height="102" class="card-emerald"/>
  <text x="54" y="84" class="title">1. 剧情时间线与增量加密日志</text>
  <text x="54" y="106" class="desc">单轨主路径展示幕次规划与关键事件；平行分支由项目级副本承载</text>
  <text x="54" y="125" class="desc">节点变更追加写入 story_graph.wal 密文日志（满 40 帧自动压实）</text>
  <text x="54" y="144" class="desc">重放检查点独立保存在 checkpoints/*.json（最多保留 12 份）</text>

  <!-- Card 2 -->
  <rect x="576" y="60" width="506" height="102" class="card-blue"/>
  <text x="592" y="84" class="title">2. 叙事三账本（事实 / 认知 / 伏笔）</text>
  <text x="592" y="106" class="desc">未命中原文引用的推测事实拒绝入账；POV 下盲区冲突事实硬裁剪</text>
  <text x="592" y="125" class="desc">伏笔按“待埋设 → 就绪 → 已触发 → 已回收 / 已废弃”五种状态流转</text>
  <text x="592" y="144" class="desc">已发生节拍逐级归纳为近期场次卡、阶段剧情线与卷纲摘要</text>

  <!-- Card 3 -->
  <rect x="38" y="176" width="506" height="102" class="card-indigo"/>
  <text x="54" y="200" class="title">3. 设定档案页与写作规则</text>
  <text x="54" y="222" class="desc">四类独立档案页，区分性格背景、说话风格与规范化动态近况</text>
  <text x="54" y="241" class="desc">快照替换、跨字段去重与终态档案整理（不改动剧情线）</text>
  <text x="54" y="260" class="desc">写作规则逐字保存全局或指定档案要求与禁忌，不经摘要改写</text>

  <!-- Card 4 -->
  <rect x="576" y="176" width="506" height="102" class="card-slate"/>
  <text x="592" y="200" class="title">4. 本地检索、语域文风与世界核查</text>
  <text x="592" y="222" class="desc">按页增量 BM25 与实体/章回锚点（正文改稿自动平移 UTF-16 偏移）</text>
  <text x="592" y="241" class="desc">文风标注 [场景｜节奏｜对白] 语域，不匹配时自动跳过</text>
  <text x="592" y="260" class="desc">世界核查保护 knowsSecret=false 盲区；回看页实时显示缓存命中率</text>
</svg>
