<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .panel { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; rx: 12; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 600; fill: #0F172A; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #64748B; }
      .card-blue { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1.2; rx: 8; }
      .card-indigo { fill: #EEF2FF; stroke: #C7D2FE; stroke-width: 1.2; rx: 8; }
      .card-emerald { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 1.2; rx: 8; }
      .card-slate { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1.2; rx: 8; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13.5px; font-weight: 600; fill: #1E293B; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #475569; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11.5px; font-weight: 600; fill: #0F172A; }
      .arrow { stroke: #64748B; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .arrow-loop { stroke: #059669; stroke-width: 1.6; fill: none; marker-end: url(#arrow-green); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1120" height="400" rx="16" class="bg"/>

  <!-- Top Row: 生成流程 (1 -> 2 -> 3 -> 4) -->
  <rect x="20" y="18" width="1080" height="168" class="panel"/>
  <text x="38" y="45" class="header">生成流程（读时上下文拼装与流式续写）</text>
  <text x="315" y="45" class="sub">未采纳的候选变体不写入世界设定</text>

  <!-- Step 1 -->
  <rect x="38" y="62" width="234" height="106" class="card-blue"/>
  <text x="52" y="86" class="title">1. 指令与视角入口</text>
  <text x="52" y="108" class="desc">手写指令或选择分支走向</text>
  <text x="52" y="126" class="desc">选择当前章节视角角色 (POV)</text>
  <text x="52" y="144" class="desc">设置续写锚点或改写选区</text>

  <!-- Step 2 -->
  <rect x="302" y="62" width="246" height="106" class="card-indigo"/>
  <text x="316" y="86" class="title">2. 三段式上下文拼装</text>
  <text x="316" y="108" class="desc">静态前缀：系统指令、目录与文风模板</text>
  <text x="316" y="126" class="desc">对话历史：保留近期对话，早期折叠</text>
  <text x="316" y="144" class="desc">尾部工作区：作者法则、在场状态与尾窗</text>

  <!-- Step 3 -->
  <rect x="578" y="62" width="246" height="106" class="card-blue"/>
  <text x="592" y="86" class="title">3. 流式续写与只读工具</text>
  <text x="592" y="108" class="desc">流式输出正文与可折叠思考卡片</text>
  <text x="592" y="126" class="desc">按需调用全文检索、读档案、展开对话</text>
  <text x="592" y="144" class="desc">无工具接口自动使用本地 BM25 检索</text>

  <!-- Step 4 -->
  <rect x="854" y="62" width="228" height="106" class="card-emerald"/>
  <text x="868" y="86" class="title">4. 散文体检与采纳提交</text>
  <text x="868" y="108" class="desc">本地检测旁白套话密度（跳过对白）</text>
  <text x="868" y="126" class="desc">多变体左右切换对比</text>
  <text x="868" y="144" class="desc">点击插入或追加正文才触发状态更新</text>

  <path d="M 272 115 L 298 115" class="arrow"/>
  <path d="M 548 115 L 574 115" class="arrow"/>
  <path d="M 824 115 L 850 115" class="arrow"/>

  <!-- Bottom Row: 采纳后更新 (8 <- 7 <- 6 <- 5) -->
  <rect x="20" y="214" width="1080" height="168" class="panel"/>
  <text x="38" y="241" class="header">入库流程（写时状态更新与记忆自审）</text>
  <text x="300" y="241" class="sub">采纳正文后后台运行，支持随撤销、重做或支线切换同步回滚</text>

  <!-- Step 8 -->
  <rect x="38" y="258" width="234" height="106" class="card-slate"/>
  <text x="52" y="282" class="title">8. 分支推演与记忆自审</text>
  <text x="52" y="304" class="desc">按需推演 2–3 条后续剧情走向</text>
  <text x="52" y="322" class="desc">核对正文审查陈旧认知与超期伏笔</text>
  <text x="52" y="340" class="desc">逐级归纳场次卡、阶段剧情线与卷纲</text>

  <!-- Step 7 -->
  <rect x="302" y="258" width="246" height="106" class="card-emerald"/>
  <text x="316" y="282" class="title">7. 状态机更新</text>
  <text x="316" y="304" class="desc">按权威等级更新事实、认知与伏笔</text>
  <text x="316" y="322" class="desc">更新对应角色、地点、物品档案页</text>
  <text x="316" y="340" class="desc">隔离支线状态，共享全书通用设定</text>

  <!-- Step 6 -->
  <rect x="578" y="258" width="246" height="106" class="card-indigo"/>
  <text x="592" y="282" class="title">6. 单步增量抽取</text>
  <text x="592" y="304" class="desc">后台抽取本段新增事实与状态变化</text>
  <text x="592" y="322" class="desc">校验原文引文位置，过滤无依据推断</text>
  <text x="592" y="340" class="desc">自动识别新出场角色与地点并建档</text>

  <!-- Step 5 -->
  <rect x="854" y="258" width="228" height="106" class="card-slate"/>
  <text x="868" y="282" class="title">5. 增量日志与本地索引</text>
  <text x="868" y="304" class="desc">追加剧情图谱增量加密日志 (WAL)</text>
  <text x="868" y="322" class="desc">提取人名、地点、物品与时间锚点</text>
  <text x="868" y="340" class="desc">按页增量更新本地 BM25 索引</text>

  <path d="M 968 168 L 968 254" class="arrow-loop"/>
  <text x="978" y="204" class="tag">采纳正文</text>

  <path d="M 854 311 L 828 311" class="arrow"/>
  <path d="M 578 311 L 552 311" class="arrow"/>
  <path d="M 302 311 L 276 311" class="arrow"/>

  <path d="M 155 258 L 155 172" class="arrow-loop"/>
  <text x="165" y="204" class="tag">下一轮续写</text>
</svg>
